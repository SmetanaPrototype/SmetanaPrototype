name: Update certificates

on:
  push:
    paths:
      - "certificates/files/*.pdf"
      - "certificates/parse_certs.py"
      - ".github/workflows/update-certs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf matplotlib numpy

      - name: Debug — show files
        run: |
          pwd
          ls -la
          ls -la certificates || true
          ls -la certificates/files || true

      - name: Parse certificates
        run: python certificates/parse_certs.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Add radar.png to tracking so it gets included in the commit
          git add README.md certificates/certificates.json certificates/radar.png
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update certificates"
            git push
          fi
